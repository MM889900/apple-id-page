<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍎 小火箭共享账号 - 每日更新</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
    .header{background:linear-gradient(135deg,#ff6b6b,#4ecdc4);color:white;padding:40px 20px;text-align:center}
    .header h1{font-size:2.3em;margin-bottom:8px}
    .sub{font-size:1.1em;opacity:0.95}
    .container{max-width:1200px;margin:20px auto;padding:0 15px}
    .warning{background:#fff3cd;padding:16px;border-radius:8px;border-left:5px solid #ffc107;margin:20px 0;color:#856404}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
    .card{background:white;border-radius:12px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,0.08)}
    .region{color:#0071e3;font-weight:bold;margin-bottom:8px}
    .acc{font-family:monospace;font-size:1.05em;background:#f8f9fa;padding:12px;border-radius:6px;margin:10px 0;word-break:break-all}
    button{background:#007bff;color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:15px;margin:4px}
    button:hover{background:#0056b3}
    .footer{text-align:center;color:#666;margin:50px 0;font-size:0.95em}
  </style>
</head>
<body>

<div class="header">
  <h1>🍎 小火箭共享账号（每日更新）</h1>
  <p class="sub">日区 / 港区 / 台区 / 美区 Apple ID · 免费 Shadowrocket 节点</p>
</div>

<div class="container">
  <div class="warning">
    <strong>⚠️ 重要提示：</strong> 请仅在 <strong>App Store</strong> 登录，切勿登录 iCloud 设置，否则可能导致锁机！<br>
    本站账号来自海外社区贡献者，仅供学习测试，请2小时内退出并删除。
  </div>

  <div class="grid" id="grid"></div>

  <div style="text-align:center;margin:40px 0">
    <p><strong>喜欢本站？按 Ctrl + D 收藏，并分享给朋友</strong></p>
    <p>争做全网最好的苹果ID与Shadowrocket共享账号网站</p>
  </div>
</div>

<script>
const accounts = []; // python 会动态填充

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = accounts.map(item => `
    <div class="card">
      <div class="region">【${item.region}】</div>
      <div class="acc">${item.acc}</div>
      <div style="margin:10px 0">密码：${item.pwd}</div>
      <button onclick="copy('${item.acc}',this)">复制账号</button>
      <button onclick="copy('${item.pwd}',this)">复制密码</button>
    </div>
  `).join('');
}

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = old, 2000);
  });
}

render();
</script>

</body>
</html>
