name: Build README

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行抓取脚本
        env:
          URLS: ${{ secrets.URLS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python apple.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html
          git stash
          git pull --rebase origin main
          git stash pop
          git add README.md docs/index.html
          git diff --cached --quiet || git commit -m "🍎 自动更新 Apple ID [$(date +'%Y-%m-%d %H:%M')]"
          git push
